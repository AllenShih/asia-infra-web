name: Validate site

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and validate site
        run: pnpm verify

      - name: Confirm generated files are current
        run: git diff --exit-code -- index.html zh-TW news feed.xml sitemap.xml

      - name: Upload preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: infragraph-site-preview
          path: _site
          retention-days: 7
